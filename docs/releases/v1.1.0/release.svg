<text x="103" y="333" fill="#F8F5FF" font-family="Liberation Sans, sans-serif" font-size="28" font-weight="700" >Uma lista pros seus routers</text>
<text x="103" y="369" fill="#BCB1D2" font-family="Liberation Sans, sans-serif" font-size="23" font-weight="400" >Contas, uso e conexões aparecem juntas. O ícone da barra é 9R.</text>
