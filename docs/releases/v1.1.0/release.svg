<text x="103" y="467" fill="#BCB1D2" font-family="Liberation Sans, sans-serif" font-size="23" font-weight="400" >A cota livre ordena as opções, com renovação e estado da leitura.</text>
<circle cx="83" cy="521" r="6" fill="#FFC61A"/>
<text x="103" y="529" fill="#F8F5FF" font-family="Liberation Sans, sans-serif" font-size="28" font-weight="700" >Uso por período e rota</text>
<text x="103" y="565" fill="#BCB1D2" font-family="Liberation Sans, sans-serif" font-size="23" font-weight="400" >Consulte Hoje, 7 dias, 30 dias e Total e veja onde usar a conta.</text>
