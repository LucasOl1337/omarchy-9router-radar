<text x="103" y="709" fill="#F8F5FF" font-family="Liberation Sans, sans-serif" font-size="28" font-weight="700" >Sem abas por domínio</text>
<text x="103" y="745" fill="#BCB1D2" font-family="Liberation Sans, sans-serif" font-size="23" font-weight="400" >O radar reúne os routers e troca a versão da interface sem cache antigo.</text>
